<!-- Create a tree of folders/files similar to neovim NERDTREE-->

<!DOCTYPE html>
<html lang="en-us">
   <head>
      <meta charset="UTF-8">
      <meta description="Replacing Javascript">
      <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
      <title>Tree</title>

      <link rel="stylesheet" type="text/css" href="tree.css">
   </head>

   <body>
      <div id="maincontainer">
         <form method="post" action="/tree/{files}">
            <button id="submitfiles" name="submitbutton">Select Folder</button>
            <div id=branchcontainer>
               <ul class="folderdropdown">
                  <!-- temporary, idk how to use wasm yet, I know what I mean tho-->
                  {{folders}}
               </ul>
            </div>
         </form>
      </div>
   </body>
</html>
