<!DOCTYPE html>
<html lang="en-us">
   <head>
      <meta charset="UTF-8">
      <meta description="Replacing Javascript">
      <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
      <title>Echo</title>

      <link rel="stylesheet" type="text/css" href="styles.css">
   </head>

   <body>
      <div id=maincontainer>
         <!--simple calculator-->
         <div id=calculatorcontainer>
            <form method="post" action="/calculator">
               <!--User can only type certain characters, can't use html
                  patterns because of input at submit rather than runtime
               -->
               <input type="hidden" name="key" value="{{calcsubmit}}">
               <div id="calcgrid">
                  <p>{{calcsubmit}}</p>

                  <button class="calcbuttons" type="submit" name="input" value="7">7</button>
                  <button class="calcbuttons" type="submit" name="input" value="8">8</button>
                  <button class="calcbuttons" type="submit" name="input" value="9">9</button>
                  <button class="calcbuttons" type="submit" name="input" value="/">÷</button>

                  <button class="calcbuttons" type="submit" name="input" value="4">4</button>
                  <button class="calcbuttons" type="submit" name="input" value="5">5</button>
                  <button class="calcbuttons" type="submit" name="input" value="6">6</button>
                  <button class="calcbuttons" type="submit" name="input" value="*">×</button>

                  <button class="calcbuttons" type="submit" name="input" value="1">1</button>
                  <button class="calcbuttons" type="submit" name="input" value="2">2</button>
                  <button class="calcbuttons" type="submit" name="input" value="3">3</button>
                  <button class="calcbuttons" type="submit" name="input" value="-">−</button>

                  <button class="calcbuttons" type="submit" name="calcaction" value="calcclear">C</button>
                  <button class="calcbuttons" type="submit" name="input" value="0">0</button>
                  <button class="calcbuttons" type="submit" name="input" value=".">.</button>
                  <button class="calcbuttons" type="submit" name="input" value="+">+</button>

                  <button class="calcbuttons equals" type="submit" name="calcaction" value="calcequal">=</button>
               </div>
            </form>
         </div>
      </div>
   </body>
</html>
