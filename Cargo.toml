[package]
name = "rust-replaces-javascript"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
fs = "0.0.6"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs"] }
